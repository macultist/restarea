<style>
:root{color-scheme:light;--bg:#e9edf2;--surface:#fff;--ink:#0f1b2d;--muted:#55627a;--line:#cfd6e0;--navy:#0f1b2d;--accent:#2b5db8;--accent-soft:#e3ebfa;--cheap:#0d9f7c;--cheap-soft:#dff5ec;--pricey:#d0433b;--pricey-soft:#fbe3e1;--mid:#6b7890;--mid-soft:#e6eaf0}
